<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 23</title>
<style>
body { margin:0; font-family: Arial, sans-serif; color:#333; background-color:#f8f9fa; }
.container { padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
.container img, .container iframe { max-width: 90%; height: auto; border:1px solid #ddd; box-shadow:0 0 5px rgba(0,0,0,0.3); }
nav { margin-top: 20px; text-align: center; }
nav a { color:#0066cc; text-decoration:none; margin: 0 10px; }
nav a:hover { text-decoration: underline; }
@media (max-width: 800px) { .container img, .container iframe { max-width: 100%; } }

</style>
<script>
document.addEventListener('keydown', function(event) {
    if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
        window.location.href = 'slide24.html';
    } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
        window.location.href = 'slide22.html';
    } else if (event.key === 'Home') {
        window.location.href = 'index.html';
    }
});
</script>
</head>
<body>
<div class="container"><img src="slides/slide23.png" alt="Slide 23"></div>
<nav><a href="slide22.html">&laquo; Previous</a> | <a href="index.html">Cover</a> | <a href="slide24.html">Next &raquo;</a></nav>
</body>
</html>
